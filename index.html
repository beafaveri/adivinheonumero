<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o Número - Projeto 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            margin: 0 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #000000;
            background-color: #9bacb0;
        }

        #form1 {
            width: 54rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 4rem;
            background-color: rgb(255, 255, 255);
            border-radius: 1rem;
        }

        .input-container {
            display: flex;
            flex-direction: row;
            gap: 1rem;
        }

        h1 {
            align-self: center;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        #form1 #number {
            width: 20rem;
        }

        .botao-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 3rem;
        }

        #botaoVerificar, #botaoReiniciar {
            width: 6rem;
            border-radius: 0.3rem;
            font-size: 0.9rem;
            padding: 0.7rem;
            text-align: center;
            align-self: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            color: rgb(255, 255, 255);
            background-color: rgb(46, 146, 53);
        }

        #historico {
            margin-left: 1rem;
            font-size: smaller;
        }
        
        h4 {
            font-weight: 400;
        }

        @media screen and (max-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                height: 100vh;
            }

            #form1 {
                width: 26rem;
                height: 40rem;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                padding: 2.5rem;
            }

            h1 {
                font-size: 1.7rem;
            }

            .input-container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #historico-container {
                align-self: self-start;
            }

            .botao-container {
                display: flex;
                gap: 3rem;
            }
        }

    </style>
</head>
<body>
    <form id="form1">
        <h1>Adivinhe o Número</h1>
        <label for="number">Digite um número inteiro de 1 a 10:</label>
        <div class="input-container">
            <input id="number" min="1" max="10" type= "number" required>
            <p id="resposta"></p>
        </div>
        <div id="historico-container">
            <h4>Histórico:</h4>
            <ul id="historico"></ul>
        </div>
        <div class="botao-container">
            <button id="botaoVerificar">Verificar</button>
            <button id="botaoReiniciar">Reiniciar</button>
        </div>
    </form>

    <script>
    let secreto = Math.floor(Math.random() * 10) + 1;
    let resposta = document.getElementById('resposta');
    const botaoVerificar = document.getElementById('botaoVerificar');
    const botaoReiniciar = document.getElementById('botaoReiniciar');
    const historico = document.getElementById('historico');
    const number = document.getElementById('number');
    let tentativas = 5;
    botaoReiniciar.style.display = 'none';
    resposta.innerText = `Tente adivinhar o número! Tentativas: ${tentativas}`;

    function sortearNumero() {
        number.disabled = false;
        tentativas = 5;
        secreto = Math.floor(Math.random() * 10) + 1;
        resposta.innerText = `Número atualizado, tente adivinhar!`;
        document.getElementById('number').value = '';
        botaoVerificar.style.display = 'block';
        historico.innerHTML = '';
    }

    function checkPalpite(palpite) {

        tentativas--;
        const li = document.createElement('li');
        li.innerText = `Tentativa ${5 - tentativas} de 5: ${palpite}`;
        historico.appendChild(li);

        if (palpite > secreto) {
            resposta.innerText = `Errou! Tente um número menor! 🔻`;
            li.style.color = 'red';
            li.innerText += ' 🔻';
            document.getElementById('number').value = '';
        } else if (palpite < secreto) {
            resposta.innerText = `Errou! Tente um número maior! 🔺`;
            li.style.color = 'blue';
            li.innerText += ' 🔺';
            document.getElementById('number').value = '';
        } else {
            resposta.innerText = `🎉 Parabéns, você acertou! Resposta certa: ${secreto}`;
            li.style.color = 'green';
            li.innerText += ' ✅'
            document.getElementById('number').value = '';
            number.disabled = true;
            botaoVerificar.style.display = 'none';
            return;
        }

        if (tentativas === 0) {
            resposta.innerText = `🚫 Tentativas esgotadas! O número era: ${secreto}`;
            number.disabled = true;
            botaoVerificar.style.display = 'none';
            return;
        }
    }

    function checkNumber(event) {
        event.preventDefault();
        number.focus()
        let palpite = parseInt(document.getElementById('number').value);
        console.log(palpite);
        
        if(isNaN(palpite) || palpite < 1 || palpite > 10) {
            resposta.innerText = 'Digite um número válido!';
            document.getElementById('number').value = '';
            return;
        } else {
            checkPalpite(palpite);
        }

        botaoReiniciar.style.display = 'block';
    }

    botaoVerificar.addEventListener('click', checkNumber);
    botaoReiniciar.addEventListener('click', sortearNumero);
    </script>
</body>
</html>
